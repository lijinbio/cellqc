$schema: "http://json-schema.org/draft-06/schema#"

description: cellqc configuration

type: object

properties:
  samples:
    type: string
    description: path to the tab-delimited sample file

  seed:
    type: integer
    description: >
      Seed for every stochastic step (PCA/UMAP/t-SNE, artificial-doublet
      sampling). v0.1.0 set no seed and was therefore not reproducible.

  ambient:
    type: object
    properties:
      method:
        enum: [soupx, decontx, none]
        description: the one method whose correction is applied to the counts
      compare:
        type: array
        description: >
          Methods run for their contamination estimate only. These never touch
          the counts -- they exist so disagreement is visible, not so a
          correction can be chosen post hoc by how the result looks.
        items:
          enum: [soupx, decontx]
        uniqueItems: true
    additionalProperties: false

  nuclear_fraction:
    type: object
    description: >
      No skip key by design. The step is enabled per sample by the presence of
      an indexed possorted_genome_bam.bam in the Cell Ranger directory.
    properties:
      numthreads:
        type: integer
        minimum: 1
      cbtag:
        type: string
        minLength: 1
      retag:
        type: string
        minLength: 1
      exontag:
        type: string
        minLength: 1
      introntag:
        type: string
        minLength: 1
    additionalProperties: false

  filterbycount:
    type: object
    properties:
      mincount:
        type: integer
        minimum: 0
        description: minimum total UMI per cell
      minfeature:
        type: integer
        minimum: 0
        description: minimum detected genes per cell
      mito:
        type: number
        minimum: 0
        maximum: 100
        description: maximum percent mitochondrial counts
    additionalProperties: false

  geneset:
    type: object
    description: >
      QC gene sets, by the name their metric takes in `.obs`: the set `ribo`
      gives `pct_counts_ribo`. Which genes belong to a set is a property of the
      reference, not of the pipeline, which is why it is configuration. Only
      `mt` is filtered on (filterbycount.mito); every other set is computed,
      plotted and recorded but never used to exclude a cell. Extra sets may be
      added freely -- each becomes another `pct_counts_*` column and another
      violin panel. Naming a set here replaces its default definition outright
      rather than merging key by key.
    required:
      - mt
    additionalProperties:
      type: object
      properties:
        label:
          type: string
          description: axis label in the QC violins (default "% <name>")
        patterns:
          type: array
          description: >
            Case-insensitive regexes, the primary definition of the set. Case
            insensitivity is what lets one pattern cover human MT-ND1, mouse
            mt-Nd1 and macaque alike.
          items:
            type: string
        symbols:
          type: array
          description: >
            Exact gene symbols, case-insensitive, used ONLY when no pattern
            matched anything. The escape hatch for a reference whose
            mitochondrial genes carry no contig prefix (Ensembl Mmul_10 names
            them bare: ND1, COX1, CYTB). A fallback rather than a union because
            a bare symbol such as COX1 is also a nuclear-gene alias.
          items:
            type: string
        exclude:
          type: array
          description: >
            Case-insensitive regexes removed from the match, for genes whose
            names start like a set member but are not one (RPS6KA1, RPS19BP1).
          items:
            type: string
      additionalProperties: false

  doublet:
    type: object
    description: >
      No skip key by design, as for nuclear_fraction. Doublet detection always
      runs; `run` selects the callers and `decider` selects the one that removes
      cells.
    properties:
      run:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          enum: [doubletfinder, scdblfinder]
      decider:
        enum: [doubletfinder, scdblfinder]
        description: >
          The single caller whose call removes cells. Every caller in `run`
          contributes its score to .obs, but only this one decides, so there is
          no undeclared ensemble rule.
      findpK:
        type: boolean
      numthreads:
        type: integer
        minimum: 1
      pK:
        type: number
        exclusiveMinimum: 0
        maximum: 1
      rate:
        type: number
        exclusiveMinimum: 0
        maximum: 1
        description: >
          10x multiplet rate at `capacity` cells recovered. Expected doublet
          fraction is rate * ncell / (nreaction * capacity), linear in cell
          yield because droplet occupancy is Poisson (see README, "Why the
          expected doublet rate is linear in cell yield"). Hard-coded as 0.1 in
          v0.1.0; exposed here so the assumption is visible. NOT adjusted for
          homotypic doublets, which makes it an over-estimate of the detectable
          doublet count -- the step removes slightly more cells than the true
          heterotypic count.
      capacity:
        type: integer
        minimum: 1
        description: assumed cells recovered per reaction (v0.1.0 hard-coded 13000)
      nreaction:
        type: integer
        minimum: 1
        description: >
          Reactions per library, for every sample whose row in the sample file
          does not give its own. A cohort usually shares one chemistry, so this
          is where that fact belongs; the per-sample column still wins.
    additionalProperties: false

required:
  - samples
  - seed
  - ambient
  - filterbycount
  - geneset
  - doublet
