# cellqc v0.3.0 runtime environment.
# Everything here comes from conda-forge/bioconda. The ONLY component that is
# not conda-installable is DoubletFinder (GitHub-only); see README.md.
#
# The rule is "declare what the code imports": every package below is named by
# an import in cellqc/ or by a library()/:: call in a workflow script, apart
# from the four marked as indirect. Transitive dependencies are left to the
# solver.
name: cellqc
channels:
  - conda-forge
  - bioconda
dependencies:
  # --- workflow / CLI ---
  - python=3.12
  - snakemake-minimal>=8
  - click
  - pandas
  - pyyaml
  - jinja2
  # --- python analysis stack ---
  - numpy
  - scipy
  - h5py                 # indirect: scanpy's read_10x_h5
  - matplotlib-base
  - scanpy
  - anndata
  - pysam
  # --- PDF slide report ---
  - tectonic
  # --- R analysis stack ---
  - r-base>=4.4
  - r-seurat>=5
  - r-seuratobject>=5
  - r-matrix
  # SoupX upstream has been dormant since 1.6.2 (2022-11-01); the floor asks for
  # that final release rather than letting a constrained solve pick an older one.
  - r-soupx>=1.6.2
  - r-ggplot2
  - bioconductor-dropletutils
  - bioconductor-singlecellexperiment
  - bioconductor-summarizedexperiment
  - bioconductor-zellkonverter
  - bioconductor-scdblfinder
  - bioconductor-celda   # DecontX
  # --- for the DoubletFinder install step, and its dependencies ---
  # remotes runs the one GitHub build the README documents; the other three are
  # DoubletFinder's own imports, kept here so that build does not have to reach
  # CRAN for them.
  - r-remotes
  - r-rocr
  - r-fields
  - r-kernsmooth
